# ==============================================================================
# EEVS (Enhanced External Voice Server for FiveM) - Configuration
# Usage: eevs [eevs.cfg]
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Core FiveM Gateway & External Voice Transport (Required)
# ------------------------------------------------------------------------------

# License key for your FiveM server (https://portal.cfx.re)
# Must match the sv_licenseKey configured on your cfx-server instance.
sv_licenseKey changeme

# External voice server endpoint and cfx-server voice gateway endpoint:
# Format: voice_external_host <public_voice_bind_ip:port> <cfx_server_gateway_ip:port>
voice_external_host 0.0.0.0:30123 127.0.0.1:30122

# Maximum concurrent game client ENet peers (1 .. 4095, default: 4095)
eevs_max_peers 4095

# Automatically reconnect to cfx-server voice gateway if cfx-server restarts (1 = on, 0 = off)
eevs_gateway_reconnect 1

# ------------------------------------------------------------------------------
# 2. HTTP/1.1 & WebSocket Control API (uWebSockets)
# ------------------------------------------------------------------------------

# Enable or disable the local HTTP/WebSocket control server (1 = enabled, 0 = disabled)
eevs_control_enabled 1

# Bind address and port for the Control API (HTTP + ws://<host>:<port>/ws)
# Default port is voiceBindPort + 1 (30124) if omitted.
eevs_control_host 127.0.0.1:30124

# Shared Bearer token for Control API authentication (Authorization: Bearer <key>).
# If set to "changeme" or omitted, EEVS automatically falls back to accepting
# your sv_licenseKey (or its lowercase SHA-256 hex digest).
eevs_control_key changeme

# ------------------------------------------------------------------------------
# 3. Audio Pipeline, VAD, & Opus Codec Tuning
# ------------------------------------------------------------------------------

# Voice Activity Detection (VAD) silence hangover timeout in milliseconds (20 .. 5000).
# Controls how long after the last ClientVoicePacket a player is still considered "talking".
eevs_vad_hangover_ms 150

# Voice bitrate in bits/sec for DSP-processed & synthesized streams (16000 .. 128000, default: 48000)
voice_inBitrate 48000

# Opus encoder CPU complexity (1 = fastest CPU, 10 = highest quality, default: 5)
eevs_opus_complexity 5

# ------------------------------------------------------------------------------
# 4. Plugins & Audio Clip Cache (.eevs)
# ------------------------------------------------------------------------------

# Directory scanned at startup for shared-library plugins (.dll on Windows, .so on Linux)
eevs_plugins_dir plugins

# Directory scanned at startup for pre-encoded .eevs audio clips
eevs_clips_dir clips

# Maximum RAM budget in megabytes (MB) for transient unpinned clips (voicemails, dynamic TTS).
# Least-recently-used transient clips are evicted automatically when this cap is reached.
eevs_clip_cache_mb 64

# ------------------------------------------------------------------------------
# 5. Logging (Quill Asynchronous Logger)
# ------------------------------------------------------------------------------

# Minimum log severity level: debug | info | warn | error
eevs_log_level info

# Optional log file path (uncomment to write logs to disk in addition to stdout)
# eevs_log_file logs/eevs.log
