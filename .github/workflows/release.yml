name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  package-windows:
    name: Package Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Ensure vcpkg cache directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}/.vcpkg-cache" -Force | Out-Null

      - name: Configure & Build Release
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Stage Windows Release Archive
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/eevs-windows-x64
          Compress-Archive -Path "dist/eevs-windows-x64/*" -DestinationPath "dist/eevs-windows-x64.zip" -Force

      - name: Upload Windows Archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/eevs-windows-x64.zip

  package-linux:
    name: Package Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config curl zip unzip tar lsb-release wget software-properties-common gnupg
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- all
          LLVM_VER=$(ls /usr/bin/clang++-* | sed -E 's/.*clang\+\+-([0-9]+)$/\1/' | sort -n | tail -1)
          echo "CC=clang-${LLVM_VER}" >> $GITHUB_ENV
          echo "CXX=clang++-${LLVM_VER}" >> $GITHUB_ENV
          echo "LDFLAGS=-fuse-ld=lld-${LLVM_VER}" >> $GITHUB_ENV

      - name: Set up vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-linux-x64-clang-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-linux-x64-

      - name: Ensure vcpkg cache directory exists
        run: mkdir -p "${{ github.workspace }}/.vcpkg-cache"

      - name: Configure & Build Release
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Stage Linux Release Archive
        run: |
          cmake --install build --config Release --prefix dist/eevs-linux-x64
          tar -czvf dist/eevs-linux-x64.tar.gz -C dist/eevs-linux-x64 .

      - name: Upload Linux Archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/eevs-linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [ package-windows, package-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/eevs-windows-x64.zip
            artifacts/eevs-linux-x64.tar.gz
